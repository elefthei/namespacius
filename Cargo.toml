[package]
name = "namespacius"
version = "0.1.0"
edition = "2021"
license = "MIT"

[dependencies]
vstd = { version = "=0.0.0-2026-09-06-0133", default-features = false, features = ["alloc"] }
verus-bumpalo = { git = "https://github.com/elefthei/bumpus", rev = "36c8e8723d767934a502fc1d9cea0ba49cff54ab" }
hashbrown = { version = "0.17", default-features = false }
foldhash = { version = "0.2", default-features = false }
lru = "0.18"

[dev-dependencies]
criterion = "0.8"

[[bench]]
name = "intern"
harness = false

[package.metadata.verus]
verify = true

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(verus_only)', 'cfg(verus_keep_ghost)'] }
